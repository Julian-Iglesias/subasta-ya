<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SubastaYa | Acceso</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <main class="auth-layout">
        <section class="intro-panel">
            <p class="eyebrow">SUBASTAYA</p>
            <h1>Tu próxima oportunidad empieza acá.</h1>
            <p class="intro-copy">Accedé a tu cuenta para participar en subastas y seguir tus ofertas.</p>
            <div class="status-chip">
                <span class="status-dot"></span>
                API disponible en localhost:3000
            </div>
        </section>

        <section class="auth-panel" aria-label="Acceso a SubastaYa">
            <div class="auth-heading">
                <p class="section-label">CUENTA</p>
                <h2 id="form-title">Iniciar sesión</h2>
                <p id="form-description">Ingresá tus datos para continuar.</p>
            </div>

            <div class="tabs" role="tablist" aria-label="Acciones de cuenta">
                <button class="tab is-active" type="button" data-view="login" role="tab" aria-selected="true">Iniciar sesión</button>
                <button class="tab" type="button" data-view="register" role="tab" aria-selected="false">Crear cuenta</button>
            </div>

            <form id="auth-form">
                <div class="field-group register-only" hidden>
                    <label for="name">Nombre</label>
                    <input id="name" name="name" type="text" autocomplete="name" placeholder="Tu nombre">
                </div>

                <div class="field-group">
                    <label for="email">Email</label>
                    <input id="email" name="email" type="email" autocomplete="email" placeholder="nombre@ejemplo.com" required>
                </div>

                <div class="field-group">
                    <label for="password">Contraseña</label>
                    <input id="password" name="password" type="password" autocomplete="current-password" placeholder="Mínimo 6 caracteres" required>
                </div>

                <button class="submit-button" type="submit" id="submit-button">Ingresar</button>
                <p id="feedback" class="feedback" role="status" aria-live="polite"></p>
            </form>

            <div id="session-card" class="session-card" hidden>
                <span class="session-kicker">SESIÓN ACTIVA</span>
                <strong id="session-name"></strong>
                <span id="session-email"></span>
                <button id="logout-button" class="logout-button" type="button">Cerrar sesión</button>
            </div>
        </section>
    </main>
    <script src="./app.js"></script>
</body>
</html>
