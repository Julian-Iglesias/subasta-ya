<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SubastaYa | Mi billetera</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body class="app-shell">
    <div data-app-header></div>
    <main class="page-content">
        <div class="page-heading">
            <div>
                <p class="eyebrow-dark">FINANZAS</p>
                <h1>Mi billetera</h1>
                <p>Consultá tus fondos y movimientos de ejemplo para entender cómo se verá este módulo.</p>
            </div>
            <button class="button" id="open-deposit-modal" type="button">Cargar saldo</button>
        </div>

        <div class="stats-grid">
            <article class="stat-card"><p class="card-label">Saldo total</p><strong id="total-balance">Cargando...</strong></article>
            <article class="stat-card"><p class="card-label">Saldo retenido</p><strong id="held-balance">Cargando...</strong></article>
            <article class="stat-card available"><p class="card-label">Saldo disponible</p><strong id="available-balance">Cargando...</strong></article>
        </div>

        <section class="panel">
            <h2>Movimientos recientes</h2>
            <div class="table-wrap">
                <table class="data-table">
                    <thead><tr><th>Fecha</th><th>Concepto</th><th>Estado</th><th>Monto</th></tr></thead>
                    <tbody id="movements-body"><tr><td colspan="4">Cargando movimientos...</td></tr></tbody>
                </table>
            </div>
            <p id="wallet-message" class="feedback" role="status" aria-live="polite"></p>
        </section>
    </main>
    <div class="modal-backdrop" id="deposit-modal" hidden>
        <section class="modal" role="dialog" aria-modal="true" aria-labelledby="deposit-modal-title">
            <div class="modal-header">
                <div>
                    <p class="eyebrow-dark">BILLETERA</p>
                    <h2 id="deposit-modal-title">Cargar saldo</h2>
                </div>
                <button class="modal-close" id="close-deposit-modal" type="button" aria-label="Cerrar">&times;</button>
            </div>
            <form id="deposit-form" novalidate>
                <div class="field-group">
                    <label for="deposit-amount">Monto</label>
                    <input id="deposit-amount" name="amount" type="number" min="0.01" step="0.01" placeholder="$ 10.000">
                    <span class="field-error" id="deposit-error"></span>
                </div>
                <div class="modal-actions">
                    <button class="button-secondary" id="cancel-deposit-modal" type="button">Cancelar</button>
                    <button class="button" id="submit-deposit" type="submit" disabled>Cargar saldo</button>
                </div>
                <p id="deposit-feedback" class="feedback" role="status" aria-live="polite"></p>
            </form>
        </section>
    </div>
    <script src="./navigation.js"></script>
    <script src="./billetera.js"></script>
</body>
</html>
