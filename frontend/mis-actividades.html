<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SubastaYa | Mis actividades</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body class="app-shell">
    <div data-app-header></div>
    <main class="page-content">
        <div class="page-heading">
            <div>
                <p class="eyebrow-dark">MI CUENTA</p>
                <h1>Mis actividades</h1>
                <p>Un resumen de tus participaciones y publicaciones.</p>
            </div>
        </div>

        <div class="tabs-panel" role="tablist">
            <button class="active" type="button" data-activity-tab="bids">Mis pujas / compras</button>
            <button type="button" data-activity-tab="publications">Mis publicaciones</button>
        </div>

        <section class="panel activity-list" id="bids-panel">
            <p class="activity-message">Cargando actividad...</p>
        </section>

        <section class="panel activity-list" id="publications-panel">
            <p class="activity-message">Cargando publicaciones...</p>
        </section>
    </main>
    <script src="./navigation.js"></script>
    <script src="./actividades.js"></script>
</body>
</html>
