<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SubastaYa | Subastas</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body class="app-shell">
    <div data-app-header></div>

    <main class="page-content">
        <div class="page-heading">
            <div id="categorias">
                <p class="eyebrow-dark">EXPLORAR</p>
                <h1>Subastas</h1>
                <p>Encontrá oportunidades, compará ofertas y elegí tu próxima puja.</p>
            </div>
            <button class="button" id="open-auction-modal" type="button">Crear subasta</button>
        </div>

        <section class="catalog-toolbar" aria-label="Filtros del catálogo">
            <div>
                <p class="card-label">Categorías</p>
                <div class="filter-row" id="category-filters" role="group" aria-label="Filtrar por categoría"></div>
            </div>
            <div>
                <p class="card-label">Estado</p>
                <div class="filter-row" id="status-filters" role="group" aria-label="Filtrar por estado">
                    <button class="filter-chip active" type="button" data-status="">Todas</button>
                    <button class="filter-chip" type="button" data-status="ACTIVE">Activas</button>
                    <button class="filter-chip" type="button" data-status="UPCOMING">Próximas</button>
                    <button class="filter-chip" type="button" data-status="FINISHED">Finalizadas</button>
                </div>
            </div>
            <div class="sort-row">
                <label for="sort-select">Ordenar resultados</label>
                <select class="sort-select" id="sort-select">
                    <option value="time_asc">Terminan pronto</option>
                    <option value="bid_desc">Mayor puja</option>
                </select>
            </div>
        </section>

        <div id="catalog-message" class="catalog-message" role="status" aria-live="polite">Cargando subastas...</div>
        <section class="auction-grid" id="auction-grid" aria-label="Listado de subastas"></section>
    </main>

    <div class="modal-backdrop" id="auction-modal" hidden>
        <section class="modal" role="dialog" aria-modal="true" aria-labelledby="auction-modal-title">
            <div class="modal-header">
                <div>
                    <p class="eyebrow-dark">PUBLICAR</p>
                    <h2 id="auction-modal-title">Crear subasta</h2>
                </div>
                <button class="modal-close" id="close-auction-modal" type="button" aria-label="Cerrar">&times;</button>
            </div>

            <form id="auction-form" novalidate>
                <div class="form-grid">
                    <div class="field-group full-width">
                        <label for="auction-title">Título</label>
                        <input id="auction-title" name="title" type="text" placeholder="Ej. Cámara mirrorless">
                        <span class="field-error" data-error-for="title"></span>
                    </div>
                    <div class="field-group full-width">
                        <label for="auction-description">Descripción</label>
                        <textarea id="auction-description" name="description" placeholder="Describí el producto"></textarea>
                        <span class="field-error" data-error-for="description"></span>
                    </div>
                    <div class="field-group">
                        <label for="auction-image-url">URL de imagen</label>
                        <input id="auction-image-url" name="imageUrl" type="url" placeholder="https://...">
                        <span class="field-error" data-error-for="imageUrl"></span>
                    </div>
                    <div class="field-group">
                        <label for="auction-category">Categoría</label>
                        <select id="auction-category" name="categoryId">
                            <option value="">Seleccioná una categoría</option>
                            <option value="1">Tecnología</option>
                            <option value="2">Coleccionables</option>
                            <option value="3">Indumentaria</option>
                            <option value="4">Vehiculos</option>
                        </select>
                        <span class="field-error" data-error-for="categoryId"></span>
                    </div>
                    <div class="field-group">
                        <label for="auction-base-price">Precio base</label>
                        <input id="auction-base-price" name="basePrice" type="number" step="0.01" placeholder="$ 10.000">
                        <span class="field-error" data-error-for="basePrice"></span>
                    </div>
                    <div class="field-group">
                        <label for="auction-minimum-increment">Incremento mínimo</label>
                        <input id="auction-minimum-increment" name="minimumIncrement" type="number" step="0.01" placeholder="$ 500">
                        <span class="field-error" data-error-for="minimumIncrement"></span>
                    </div>
                    <div class="field-group">
                        <label for="auction-start-date">Fecha y hora de inicio</label>
                        <input id="auction-start-date" name="startDate" type="datetime-local">
                        <span class="field-error" data-error-for="startDate"></span>
                    </div>
                    <div class="field-group">
                        <label for="auction-end-date">Fecha y hora de fin</label>
                        <input id="auction-end-date" name="endDate" type="datetime-local">
                        <span class="field-error" data-error-for="endDate"></span>
                    </div>
                </div>

                <div class="modal-actions">
                    <button class="button-secondary" id="cancel-auction-modal" type="button">Cancelar</button>
                    <button class="button" id="submit-auction" type="submit">Publicar subasta</button>
                </div>
                <p class="feedback" id="auction-feedback" role="status" aria-live="polite"></p>
            </form>
        </section>
    </div>

    <script src="./navigation.js"></script>
    <script src="./catalogo.js"></script>
</body>
</html>
